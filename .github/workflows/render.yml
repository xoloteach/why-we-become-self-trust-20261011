name: Render reviewed motion source
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [part00, part01, part02, part03, part04, part05, part06, part07, part08, part09, part10, part11, short_01, short_02, short_03]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - run: pip install numpy opencv-python-headless pillow
      - run: mkdir -p out qa && python audio.py
      - name: Render exact frame range
        env:
          TARGET: ${{ matrix.target }}
        run: |
          python - <<'PY'
          import os, subprocess
          target=os.environ['TARGET']
          command=['python','motion.py','--out','out/'+target+'.mp4']
          if target.startswith('part'):
            i=int(target[4:]);n=19741
            command += ['--target','longform','--start',str((n*i//12)/30),'--stop',str((n*(i+1)//12)/30)]
          else:
            command += ['--target',target]
          subprocess.run(command,check=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: out/*.mp4
          retention-days: 14
  assemble:
    needs: render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - run: pip install numpy opencv-python-headless pillow
      - uses: actions/download-artifact@v4
        with:
          path: rendered
          merge-multiple: true
      - run: mkdir -p out qa && python audio.py
      - name: Assemble full master with a continuous audio track
        run: |
          python - <<'PY'
          import pathlib,subprocess,shutil
          p=pathlib.Path('rendered');parts=sorted(p.glob('part*.mp4'));assert len(parts)==12
          pathlib.Path('parts.txt').write_text(''.join("file '"+str(f.resolve())+"'\n" for f in parts))
          subprocess.run(['ffmpeg','-y','-f','concat','-safe','0','-i','parts.txt','-an','-c:v','copy','out/master-video.mp4'],check=True)
          subprocess.run(['ffmpeg','-y','-i','out/master-video.mp4','-i','assets/longform-mix.wav','-map','0:v','-map','1:a','-c:v','copy','-c:a','aac','-b:a','192k','-t','658.023855','-movflags','+faststart','out/final-longform.mp4'],check=True)
          pathlib.Path('out/master-video.mp4').unlink()
          for s in p.glob('short_*.mp4'):shutil.copy(s,'out/'+s.name)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-delivery-candidate
          path: out/*.mp4
          retention-days: 14
